{% extends 'inventario/base.html' %}
{% block content %}

<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10 bg-white">
    
    <div class="mb-8 border-b-2 border-[#0E2F2A] pb-4 flex flex-col sm:flex-row sm:justify-between sm:items-end gap-4">
        <div>
            <h1 class="text-3xl font-bold text-[#000000] tracking-tight uppercase">Salida Rápida</h1>
            <p class="text-sm font-medium text-gray-500 mt-1 uppercase tracking-wider">Extracción directa para mermas o ajustes urgentes</p>
        </div>
        
        <a href="{% url 'inventario:crear_orden_salida' %}" class="bg-white border-2 border-[#0E2F2A] text-[#0E2F2A] px-5 py-2.5 rounded-none text-sm font-bold hover:bg-[#0E2F2A] hover:text-white transition-colors uppercase tracking-wider shadow-sm text-center">
            Volver a Órdenes
        </a>
    </div>

    <div class="bg-white border border-gray-300 border-t-4 border-t-[#0E2F2A] shadow-sm p-8 rounded-none">
        
        <form method="POST" action="{% url 'inventario:nueva_salida' %}" class="space-y-6">
            {% csrf_token %}
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-bold text-[#0E2F2A] uppercase tracking-wider mb-2">Artículo (SKU)</label>
                    <select name="articulo" required class="block w-full rounded-none border-gray-300 shadow-sm focus:border-[#0E2F2A] focus:ring-0 text-sm border p-2.5 uppercase font-bold text-[#000000] bg-white">
                        <option value="" disabled selected>-- Seleccione un artículo --</option>
                        {% for art in articulos %}
                            <option value="{{ art.id }}">{{ art.clave }} - {{ art.descripcion }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-[#0E2F2A] uppercase tracking-wider mb-2">Rack de Extracción</label>
                    <select name="localizacion" required class="block w-full rounded-none border-gray-300 shadow-sm focus:border-[#0E2F2A] focus:ring-0 text-sm border p-2.5 uppercase font-bold text-[#000000] bg-white">
                        <option value="" disabled selected>-- Seleccione la ubicación --</option>
                        {% for loc in localizaciones %}
                            <option value="{{ loc.id }}">{{ loc.clave }} - {{ loc.almacen }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-bold text-[#0E2F2A] uppercase tracking-wider mb-2">Cantidad a Retirar</label>
                    <input type="number" name="cantidad" min="0.01" step="0.01" required placeholder="0.00"
                        class="block w-full rounded-none border-gray-300 shadow-sm focus:border-[#0E2F2A] focus:ring-0 text-lg border p-2.5 font-bold text-[#0E2F2A] bg-white">
                </div>

                <div>
                    <label class="block text-xs font-bold text-[#0E2F2A] uppercase tracking-wider mb-2">Motivo (Mermas / Ajustes)</label>
                    <input type="text" name="motivo" required placeholder="Ej. AJUSTE, MERMA, DAÑO..."
                        class="block w-full rounded-none border-gray-300 shadow-sm focus:border-[#0E2F2A] focus:ring-0 text-sm border p-2.5 uppercase font-bold text-[#000000] bg-white">
                </div>
            </div>

            <div class="border-t border-[#EDEDE2] pt-6 mt-6">
                <button type="submit" class="w-full bg-[#0E2F2A] text-white py-3.5 rounded-none text-sm font-bold uppercase tracking-wider hover:bg-[#B8D700] hover:text-[#0E2F2A] transition-colors border border-transparent hover:border-[#0E2F2A] shadow-sm">
                    Confirmar Extracción Directa
                </button>
            </div>
        </form>

    </div>
</div>

{% endblock %}

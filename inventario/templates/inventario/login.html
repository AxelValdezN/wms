<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Path Logistics</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#EDEDE2] flex items-center justify-center h-screen font-sans antialiased">
    <div class="bg-white p-8 rounded-lg shadow-x1 w-full max-w-md border-t-4 border-[#0E2F2A]">
        <div class="text-center mb-8">
            <h2 class="text-3x1 font-extrabold text-[#0E2F2A] tracking-tight">Path Logistics <span class="text-[#B8D700]">&</span> Copacker</h2>
            <p class="text-gray-500 mt-2 text-sm uppercase tracking-widest font-semibold">WMS Corporativo</p>
        </div>
        {% if form.errors %}
            <div class="bg-red-50 text-red-600 p-3 rounded text-sm mb-4 border border-red-200 text-center">
                Usuario o contraseña incorrectos. Inténtalo de nuevo.
            </div>
        {% endif %}
        <form method="post" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700">Identificador de Usuario</label>
                <input type="text" name="username" required autofocus class="mt-1 block w-full border-gray-300 rounded-md shadow-sm border p-3 focus:border-[#0E2F2A]">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Contraseña</label>
                <input type="password" name="password" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm border p-3 focus:border-[#0E2F2A] focus:ring-[#0E2F2A]">
            </div>
            <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm text-sm font-fold text-white bg-[#0E2F2A] hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#0E2F2A] transition-colors">
                Ingresar al sistema
            </button>
        </form>
        <div class="mt-6 text-center text-xs text-gray-400">
            &copy; 2026 Path Logistics. Acceso auditado y monitoreado.
        </div>
    </div>

</body>
</html>

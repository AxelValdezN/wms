<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Path Logistics</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Space Grotesk"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#EDEDE2] flex items-center justify-center h-screen font-sans antialiased">
    
    <div class="bg-white p-10 shadow-xl rounded-none w-full max-w-md border-t-8 border-[#0E2F2A]">
        
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-[#000000] tracking-tight uppercase">Path<span class="text-[#B8D700]">Logistics</span></h2>
            <p class="text-gray-500 mt-2 text-xs uppercase tracking-widest font-bold">& Copacker | WMS Corporativo</p>
        </div>

        {% if form.errors %}
            <div class="bg-red-50 border-l-4 border-red-600 p-4 rounded-none shadow-sm mb-6 flex items-center">
                <svg class="h-5 w-5 text-red-600 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                </svg>
                <p class="ml-3 text-xs font-bold uppercase tracking-wider text-red-800">Credenciales inválidas.</p>
            </div>
        {% endif %}

        <form method="post" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold text-[#0E2F2A] uppercase tracking-wider mb-2">Identificador de Usuario</label>
                <input type="text" name="username" required autofocus 
                       class="block w-full rounded-none border-gray-300 shadow-sm focus:border-[#0E2F2A] focus:ring-0 text-sm border p-3 font-bold text-[#000000]">
            </div>
            <div>
                <label class="block text-xs font-bold text-[#0E2F2A] uppercase tracking-wider mb-2">Contraseña</label>
                <input type="password" name="password" required 
                       class="block w-full rounded-none border-gray-300 shadow-sm focus:border-[#0E2F2A] focus:ring-0 text-sm border p-3 font-bold text-[#000000]">
            </div>
            
            <button type="submit" class="w-full mt-4 flex justify-center py-3 px-4 border border-transparent rounded-none shadow-sm text-sm font-bold text-white bg-[#0E2F2A] hover:bg-[#B8D700] hover:text-[#0E2F2A] transition-colors uppercase tracking-wider">
                Ingresar al andén
            </button>
        </form>

        <div class="mt-8 text-center text-xs font-medium text-gray-400 uppercase tracking-wider border-t border-[#EDEDE2] pt-4">
            &copy; 2026 Path Logistics<br>Acceso auditado y monitoreado
        </div>
    </div>

</body>
</html>

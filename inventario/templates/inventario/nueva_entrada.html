{% extends 'inventario/base.html' %}

{% block content %}
<div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    
    <div class="mb-8 border-b-2 border-[#0E2F2A] pb-4">
        <h1 class="text-3xl font-black text-[#0E2F2A] tracking-tighter uppercase">Recepción de Mercancía</h1>
        <p class="text-sm font-medium text-gray-500 mt-2">Módulo de ingresos a rampa. Toda entrada será pasada automáticamente a DISPONIBLE.</p>
    </div>

    <div class="bg-white shadow-sm border border-gray-300 p-8 rounded-none">
        <form action="{% url 'inventario:nueva_entrada' %}" method="POST" class="space-y-8">
            {% csrf_token %} 
            
            <div class="bg-[#EDEDE2] p-6 border-l-4 border-[#0E2F2A]">
                <h2 class="text-sm font-black text-[#0E2F2A] uppercase tracking-widest mb-4">1. Documentación de Origen</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-[#0E2F2A] uppercase tracking-wider mb-2">Folio de Ingreso (Factura/Remisión)</label>
                        <input type="text" name="folio" required placeholder="Ej. FAC-9021" 
                               class="w-full border border-gray-300 p-3 text-sm rounded-none focus:ring-[#B8D700] focus:border-[#B8D700] uppercase bg-white transition-colors">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#0E2F2A] uppercase tracking-wider mb-2">Cliente / Proveedor</label>
                        <input type="text" name="cliente" required placeholder="Ej. Proveedor Central SA" 
                               class="w-full border border-gray-300 p-3 text-sm rounded-none focus:ring-[#B8D700] focus:border-[#B8D700] uppercase bg-white transition-colors">
                    </div>
                </div>
            </div>

            <div>
                <h2 class="text-sm font-black text-[#0E2F2A] uppercase tracking-widest mb-4 border-b border-gray-200 pb-2">2. Clasificación y Destino</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-[#0E2F2A] uppercase tracking-wider mb-2">Artículo (SKU)</label>
                        <select name="articulo" required class="w-full border border-gray-300 p-3 text-sm rounded-none focus:ring-[#B8D700] focus:border-[#B8D700] bg-white transition-colors">
                            <option value="" disabled selected>-- Selecciona el artículo --</option>
                            {% for art in articulos %}
                                <option value="{{ art.id }}">{{ art.clave }} - {{ art.descripcion }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#0E2F2A] uppercase tracking-wider mb-2">Ubicación de Destino</label>
                        <select name="localizacion" required class="w-full border border-gray-300 p-3 text-sm rounded-none focus:ring-[#B8D700] focus:border-[#B8D700] bg-white transition-colors">
                            <option value="" disabled selected>-- Selecciona el Almacén/Rack --</option>
                            {% for loc in localizaciones %}
                                <option value="{{ loc.id }}">{{ loc.clave }} ({{ loc.almacen }})</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>

            <div>
                <h2 class="text-sm font-black text-[#0E2F2A] uppercase tracking-widest mb-4 border-b border-gray-200 pb-2">3. Trazabilidad y Volumen</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-[#0E2F2A] uppercase tracking-wider mb-2">Lote del Producto</label>
                        <input type="text" name="lote" required placeholder="Ej. LOTE-26090" 
                               class="w-full border border-gray-300 p-3 text-sm rounded-none focus:ring-[#B8D700] focus:border-[#B8D700] uppercase transition-colors">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#0E2F2A] uppercase tracking-wider mb-2">Fecha de Caducidad</label>
                        <input type="date" name="fecha_caducidad"  
                               class="w-full border border-gray-300 p-3 text-sm rounded-none focus:ring-[#B8D700] focus:border-[#B8D700] transition-colors">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#0E2F2A] uppercase tracking-wider mb-2">Cantidad Ingresada</label>
                        <input type="number" step="0.01" name="cantidad" required min="0.01" placeholder="0.00" 
                               class="w-full border border-gray-300 p-3 text-sm font-bold text-[#0E2F2A] rounded-none focus:ring-[#B8D700] focus:border-[#B8D700] transition-colors">
                    </div>
                </div>
            </div>

            <div class="flex justify-end pt-6 border-t border-gray-200 space-x-4">
                <a href="{% url 'inventario:dashboard' %}" 
                   class="bg-[#EDEDE2] text-[#0E2F2A] py-3.5 px-8 font-bold text-sm uppercase tracking-wider rounded-none border border-transparent hover:border-[#0E2F2A] transition-colors">
                    Cancelar
                </a>
                <button type="submit" 
                        class="bg-[#0E2F2A] text-white py-3.5 px-8 font-black text-sm uppercase tracking-widest rounded-none border border-[#0E2F2A] hover:bg-[#B8D700] hover:text-[#0E2F2A] transition-colors shadow-sm">
                    Confirmar Ingreso a Rampa
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% extends 'inventario/base.html' %}

{% block content %}
<div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10 bg-white">
    
    <div class="mb-8 border-b-2 border-[#0E2F2A] pb-4">
        <h1 class="text-3xl font-bold text-[#000000] tracking-tight uppercase">Recepción de Mercancía</h1>
        <p class="text-sm font-medium text-gray-500 mt-2 uppercase tracking-wider">Módulo de ingresos a rampa. Toda entrada pasará a estado DISPONIBLE.</p>
    </div>

    <div class="bg-white border border-gray-300 border-t-4 border-t-[#0E2F2A] shadow-sm p-8 rounded-none">
        <form action="{% url 'inventario:nueva_entrada' %}" method="POST" class="space-y-8">
            {% csrf_token %} 
            
            <div class="bg-[#EDEDE2] p-6 border-l-4 border-[#0E2F2A]">
                <h2 class="text-sm font-bold text-[#0E2F2A] uppercase tracking-widest mb-4">1. Documentación de Origen</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-[#0E2F2A] uppercase tracking-wider mb-2">Folio de Ingreso (Factura/Remisión)</label>
                        <input type="text" name="folio" required placeholder="Ej. FAC-9021" 
                               class="block w-full rounded-none border-gray-300 shadow-sm focus:border-[#0E2F2A] focus:ring-0 text-sm border p-2.5 uppercase font-bold text-[#000000] bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#0E2F2A] uppercase tracking-wider mb-2">Cliente / Proveedor</label>
                        <input type="text" name="cliente" required placeholder="Ej. Proveedor Central SA" 
                               class="block w-full rounded-none border-gray-300 shadow-sm focus:border-[#0E2F2A] focus:ring-0 text-sm border p-2.5 uppercase font-bold text-[#000000] bg-white">
                    </div>
                </div>
            </div>

            <div>
                <h2 class="text-sm font-bold text-[#0E2F2A] uppercase tracking-widest mb-4 border-b border-[#EDEDE2] pb-2">2. Clasificación y Destino</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-[#0E2F2A] uppercase tracking-wider mb-2">Artículo (SKU)</label>
                        <select name="articulo" required class="block w-full rounded-none border-gray-300 shadow-sm focus:border-[#0E2F2A] focus:ring-0 text-sm border p-2.5 uppercase font-bold text-[#000000] bg-white">
                            <option value="" disabled selected>-- Selecciona el artículo --</option>
                            {% for art in articulos %}
                                <option value="{{ art.id }}">{{ art.clave }} - {{ art.descripcion }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#0E2F2A] uppercase tracking-wider mb-2">Ubicación de Destino</label>
                        <select name="localizacion" required class="block w-full rounded-none border-gray-300 shadow-sm focus:border-[#0E2F2A] focus:ring-0 text-sm border p-2.5 uppercase font-bold text-[#000000] bg-white">
                            <option value="" disabled selected>-- Selecciona el Almacén/Rack --</option>
                            {% for loc in localizaciones %}
                                <option value="{{ loc.id }}">{{ loc.clave }} ({{ loc.almacen }})</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>

            <div>
                <h2 class="text-sm font-bold text-[#0E2F2A] uppercase tracking-widest mb-4 border-b border-[#EDEDE2] pb-2">3. Trazabilidad y Volumen</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-[#0E2F2A] uppercase tracking-wider mb-2">Lote del Producto</label>
                        <input type="text" name="lote" required placeholder="Ej. LOTE-26090" 
                               class="block w-full rounded-none border-gray-300 shadow-sm focus:border-[#0E2F2A] focus:ring-0 text-sm border p-2.5 uppercase font-bold text-[#000000] bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#0E2F2A] uppercase tracking-wider mb-2">Fecha de Caducidad</label>
                        <input type="date" name="fecha_caducidad"  
                               class="block w-full rounded-none border-gray-300 shadow-sm focus:border-[#0E2F2A] focus:ring-0 text-sm border p-2.5 uppercase font-bold text-[#000000] bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#0E2F2A] uppercase tracking-wider mb-2">Cantidad Ingresada</label>
                        <input type="number" step="0.01" name="cantidad" required min="0.01" placeholder="0.00" 
                               class="block w-full rounded-none border-gray-300 shadow-sm focus:border-[#0E2F2A] focus:ring-0 text-lg border p-2.5 font-bold text-[#0E2F2A] bg-white">
                    </div>
                </div>
            </div>

            <div class="flex justify-end pt-6 border-t border-[#EDEDE2] gap-4">
                <a href="{% url 'inventario:dashboard' %}" 
                   class="border border-gray-300 text-[#000000] bg-[#EDEDE2] px-6 py-3 rounded-none font-bold text-sm flex items-center hover:bg-gray-200 uppercase tracking-wider transition-colors">
                    Cancelar
                </a>
                <button type="submit" 
                        class="bg-[#0E2F2A] text-white px-8 py-3 rounded-none font-bold text-sm uppercase tracking-wider hover:bg-[#B8D700] hover:text-[#0E2F2A] transition-colors border border-transparent hover:border-[#0E2F2A]">
                    Confirmar Ingreso a Rampa
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

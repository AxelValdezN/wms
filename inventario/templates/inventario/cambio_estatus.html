{% extends 'inventario/base.html' %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="mb-8 border-b border-gray-200 pb-4">
        <h1 class="text-3xl font-bold text-gray-900">Módulo de Liberación y Calidad</h1>
        <p class="text-gray-500 mt-2">Gestión rápida de estatus para mercancía en piso.</p>
    </div>

    <div class="bg-white shadow-sm border border-gray-300 rounded-md p-6">
        <form action="{% url 'inventario:cambiar_estatus' %}" method="POST" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label class="block text-sm font-medium text-gray-700">Mercancía Física a Modificar</label>
                <select name="existencia_id" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:border-[#0E2F2A] focus:ring-[#0E2F2A]">
                    <option value="" disabled selected>-- Selecciona el lote y ubicación --</option>
                    {% for ex in existencias %}
                        <option value="{{ ex.id }}">
                            {{ ex.articulo.clave }} | Ubicación: {{ ex.localizacion.almacen }} | Actual: {{ ex.get_estado_calidad_display }} (Cant: {{ ex.cantidad_actual }})
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Cantidad a Cambiar</label>
                    <input type="number" step="0.01" name="cantidad" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:border-[#0E2F2A] focus:ring-[#0E2F2A]">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nuevo Estatus de Calidad</label>
                    <select name="nuevo_estado" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:border-[#0E2F2A] focus:ring-[#0E2F2A]">
                        <option value="" disabled selected>-- ¿A dónde pasa? --</option>
                        {% for valor, etiqueta in estados %}
                            <option value="{{ valor }}">{{ etiqueta }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="flex justify-end pt-4 border-t border-gray-200">
                <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-[#0E2F2A] hover:bg-opacity-90">
                    Aplicar Cambio y Actualizar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

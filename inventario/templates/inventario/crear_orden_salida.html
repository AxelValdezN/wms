{% extends 'inventario/base.html' %}
{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10 bg-white">
    
    <div class="mb-8 border-b-2 border-[#0E2F2A] pb-4 flex flex-col sm:flex-row sm:justify-between sm:items-end gap-4">
        <div>
            <h1 class="text-3xl font-bold text-[#000000] tracking-tight uppercase">Despacho de Órdenes</h1>
            <p class="text-sm font-medium text-gray-500 mt-1 uppercase tracking-wider">Creación de órdenes maestras de surtido (PEPS)</p>
        </div>
        
        <a href="{% url 'inventario:nueva_salida' %}" class="bg-white border-2 border-[#0E2F2A] text-[#0E2F2A] px-5 py-2.5 rounded-none text-sm font-bold hover:bg-[#0E2F2A] hover:text-white transition-colors uppercase tracking-wider shadow-sm text-center">
            + Registro de Salida Rápida
        </a>
    </div>

    <div class="bg-white border border-gray-300 border-t-4 border-t-[#0E2F2A] shadow-sm p-8 rounded-none">
        
        <h2 class="text-lg font-bold text-[#0E2F2A] mb-6 border-b border-[#EDEDE2] pb-2 uppercase tracking-wider">Configuración de Picking y Rampa</h2>

        <form method="POST" action="{% url 'inventario:crear_orden_salida' %}" class="space-y-6">
            {% csrf_token %}
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-bold text-[#0E2F2A] uppercase tracking-wider mb-2">Folio de Salida</label>
                    <input type="text" name="folio" required placeholder="Ej. ORD-025"
                           class="block w-full rounded-none border-gray-300 shadow-sm focus:border-[#0E2F2A] focus:ring-0 text-sm border p-2.5 uppercase font-bold text-[#000000]">
                </div>
                <div>
                    <label class="block text-xs font-bold text-[#0E2F2A] uppercase tracking-wider mb-2">Asignar a (Operador)</label>
                    <input type="text" name="asignado_a" required placeholder="Ej. Juan Pérez"
                           class="block w-full rounded-none border-gray-300 shadow-sm focus:border-[#0E2F2A] focus:ring-0 text-sm border p-2.5 uppercase font-bold text-[#000000]">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-bold text-[#0E2F2A] uppercase tracking-wider mb-2">Destino / Rampa</label>
                    <input type="text" name="destino" required placeholder="Ej. Rampa 1"
                           class="block w-full rounded-none border-gray-300 shadow-sm focus:border-[#0E2F2A] focus:ring-0 text-sm border p-2.5 uppercase font-bold text-[#000000]">
                </div>
                <div>
                    <label class="block text-xs font-bold text-[#0E2F2A] uppercase tracking-wider mb-2">Cantidad de Control (CC)</label>
                    <input type="number" name="meta_total" step="0.01" min="0.01" required placeholder="0.00"
                           class="block w-full rounded-none border-gray-300 shadow-sm focus:border-[#0E2F2A] focus:ring-0 text-lg border p-2.5 font-bold text-[#0E2F2A]">
                    <p class="text-xs font-medium text-gray-500 mt-1 uppercase">Cantidad exacta que bloqueará el Picking List.</p>
                </div>
            </div>

            <div class="pt-4 border-t border-[#EDEDE2] mt-6 flex justify-end gap-4">
                <a href="{% url 'inventario:dashboard' %}" class="border border-gray-300 text-[#000000] bg-[#EDEDE2] px-6 py-3 rounded-none font-bold text-sm flex items-center hover:bg-gray-200 uppercase tracking-wider transition-colors">
                    Cancelar
                </a>
                
                <button type="submit" class="bg-[#0E2F2A] text-white px-8 py-3 rounded-none font-bold text-sm uppercase tracking-wider hover:bg-[#B8D700] hover:text-[#0E2F2A] transition-colors border border-transparent hover:border-[#0E2F2A]">
                    Generar Orden e Iniciar Surtido
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
